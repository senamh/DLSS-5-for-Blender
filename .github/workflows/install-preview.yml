name: Verify controls and install RTX 5070 preview
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/install-preview.yml']
permissions:
  contents: read
  actions: read
jobs:
  gpu:
    if: github.event.repository.private == true
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 4
    concurrency:
      group: rtx-pc-runtime
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: feeder-gl-view-fix
          run-id: 34215265418
          github-token: ${{ github.token }}
          path: patched-addon
      - shell: cmd
        run: python scripts/install_verified_preview.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-controls-evidence
          path: preview-evidence/
          retention-days: 7

