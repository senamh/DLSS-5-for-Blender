name: Inspect installed DLSS5 state without changing Blender
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/inspect_ready_live.py', '.github/workflows/inspect-ready-live.yml']
permissions:
  contents: read
jobs:
  inspect:
    if: github.event.repository.private == true
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - shell: cmd
        run: python scripts/inspect_ready_live.py
      - uses: actions/upload-artifact@v4
        with:
          name: live-evidence
          path: live-evidence/
          retention-days: 7

