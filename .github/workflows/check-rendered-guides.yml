name: Validate already rendered Cycles guides
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/check-rendered-guides.yml']
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install OpenEXR==3.4.15 numpy==2.4.6
      - uses: actions/download-artifact@v4
        with:
          name: actual-cycles-guides
          run-id: 34227482343
          github-token: ${{ github.token }}
          path: guide-evidence
      - run: python scripts/check_cycles_guides.py guide-evidence
      - uses: actions/upload-artifact@v4
        with:
          name: validated-cycles-guides
          path: guide-evidence/
          retention-days: 7

