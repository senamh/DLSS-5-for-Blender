name: Cancel obsolete RTX 4070 build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/cancel-obsolete.yml']
permissions:
  contents: read
  actions: write
jobs:
  cancel:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 2
    steps:
      - name: Cancel obsolete build if still running
        uses: actions/github-script@v7
        with:
          script: |
            const run_ids = [34188852088, 34192368098];
            for (const run_id of run_ids) {
              const current = await github.rest.actions.getWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id,
              });
              if (current.data.status !== 'completed') {
                await github.request('POST /repos/{owner}/{repo}/actions/runs/{run_id}/force-cancel', {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id,
                });
                core.info(`Forced cancellation requested for obsolete run ${run_id}`);
              } else {
                core.info(`Obsolete run ${run_id} is already completed`);
              }
            }

