name: Cloud software OpenGL Cycles depth probe
# Initialize isolated preferences so first-launch setup does not cover evidence.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/cloud-depth.yml']
permissions:
  contents: read
jobs:
  depth:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install software OpenGL display
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri libegl1 libxkbcommon0 libsm6 libxi6 libxrender1 imagemagick
      - name: Download checksum-pinned official Blender
        run: |
          curl --fail --location --retry 2 https://download.blender.org/release/Blender5.2/blender-5.2.1-linux-x64.tar.xz -o /tmp/blender.tar.xz
          echo 'a31f524fa99a527d3d52b7f5aaa68c34e1a19d5a1c9473f79c5cc610fd5b10e9  /tmp/blender.tar.xz' | sha256sum --check
          tar -xJf /tmp/blender.tar.xz -C /tmp
      - name: Probe real viewport buffers without NVIDIA
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
        run: |
          mkdir -p cloud-depth-evidence
          /tmp/blender-5.2.1-linux-x64/blender --background --factory-startup --python-expr "import bpy; bpy.context.preferences.view.show_splash=False; bpy.ops.wm.save_userpref()"
          set -o pipefail
          timeout 90s xvfb-run -a -s '-screen 0 1280x720x24' /tmp/blender-5.2.1-linux-x64/blender --disable-autoexec --gpu-backend opengl -p 0 0 960 640 --python-exit-code 1 --python scripts/cloud_depth_probe.py -- cloud-depth-evidence 2>&1 | tee cloud-depth-evidence/console.log
          test -s cloud-depth-evidence/report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloud-depth-evidence
          path: cloud-depth-evidence/
          retention-days: 7

